<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Control</title>
<style>
:root{
  --bg:#eef1ea; --surface:#fbfcf8; --ink:#1d2a24; --muted:#66756d; --line:#d9dfd3;
  --accent:#1f7a5c; --accent-ink:#fff; --warn:#c2410c; --on:#e3f1e8;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111a16; --surface:#1a2620; --ink:#e8efe9; --muted:#8fa399; --line:#2a3a32;
    --accent:#4cc79a; --accent-ink:#0c1a14; --warn:#fb923c; --on:#1f3a2e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111a16; --surface:#1a2620; --ink:#e8efe9; --muted:#8fa399; --line:#2a3a32;
  --accent:#4cc79a; --accent-ink:#0c1a14; --warn:#fb923c; --on:#1f3a2e; color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:24px 18px 48px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
h1{font-size:2.2rem;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--muted);margin-top:6px}
.sans{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.tools{display:flex;gap:8px}
.btn{font:600 .9rem system-ui,sans-serif;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:28px;overflow:hidden}
.readout div{padding:18px 20px;border-right:1px solid var(--line)}
.readout div:last-child{border-right:0}
.readout b{display:block;font-size:1.7rem;font-weight:700}
.readout span{color:var(--muted);font:.85rem system-ui,sans-serif}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}
.room{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.room h2{font-size:1.3rem;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.room h2 small{font:.8rem system-ui,sans-serif;color:var(--muted);font-weight:400}
.dev{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.dev .n{font:600 1rem system-ui,sans-serif}
.dev .s{font:.82rem system-ui,sans-serif;color:var(--muted)}
.dev.is-on .s{color:var(--accent)}
.tg{position:relative;width:52px;height:30px;flex:none;border-radius:30px;border:1px solid var(--line);background:var(--bg);cursor:pointer;padding:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.tg[aria-checked="true"]{background:var(--on);border-color:var(--accent)}
.tg[aria-checked="true"]::after{transform:translateX(22px);background:var(--accent)}
.sensor{font:600 .85rem system-ui,sans-serif;padding:4px 12px;border-radius:20px;background:var(--on);color:var(--accent)}
.sensor.bad{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.room .btn{width:100%;margin-top:14px}
.log{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.log h2{font-size:1.1rem;margin-bottom:8px}
.log li{list-style:none;font:.9rem system-ui,sans-serif;color:var(--muted);padding:4px 0}
.log li:first-child{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.tg::after{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Home control</h1>
      <p class="sub">Tap a switch to turn a device on or off.</p>
    </div>
    <div class="tools">
      <button class="btn" id="allOff">Turn everything off</button>
      <button class="btn primary" id="lockUp">Lock up for the night</button>
    </div>
  </div>

  <div class="readout sans">
    <div><b id="temp">24°C</b><span>Inside temperature</span></div>
    <div><b>48%</b><span>Humidity</span></div>
    <div><b id="count">0</b><span>Devices running</span></div>
    <div><b id="sec">Secure</b><span>Door and alarm</span></div>
  </div>

  <div class="rooms" id="rooms"></div>

  <section class="log">
    <h2>Recent activity</h2>
    <ul id="log"><li>Dashboard opened</li></ul>
  </section>
</div>

<script>
var rooms=[
  {name:"Living room",devs:[
    {id:"lr-light",n:"Ceiling light",on:true,t:["On","Off"]},
    {id:"lr-tv",n:"TV",on:false,t:["On","Off"]},
    {id:"lr-ac",n:"Air conditioner",on:true,t:["Cooling to 24°C","Off"]}]},
  {name:"Kitchen",devs:[
    {id:"k-gas",n:"Gas sensor",sensor:true,ok:true},
    {id:"k-oven",n:"Oven",on:false,t:["Heating","Off"]},
    {id:"k-light",n:"Light",on:true,t:["On","Off"]}]},
  {name:"Security",devs:[
    {id:"s-door",n:"Front door",on:true,t:["Locked","Unlocked"]},
    {id:"s-cam",n:"Camera",on:true,t:["Recording","Off"]},
    {id:"s-alarm",n:"Alarm",on:true,t:["Armed","Disarmed"]}]}
];
var state={};
rooms.forEach(function(r){r.devs.forEach(function(d){state[d.id]=d.sensor?d.ok:d.on;});});

function find(id){var f;rooms.forEach(function(r){r.devs.forEach(function(d){if(d.id===id)f=d;});});return f;}
function log(msg){
  var ul=document.getElementById("log"),li=document.createElement("li");
  var t=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  li.textContent=t+" – "+msg; ul.insertBefore(li,ul.firstChild);
  while(ul.children.length>5)ul.removeChild(ul.lastChild);
}
function render(){
  var host=document.getElementById("rooms");host.innerHTML="";
  rooms.forEach(function(r){
    var el=document.createElement("div");el.className="room";
    var running=r.devs.filter(function(d){return !d.sensor&&state[d.id];}).length;
    el.innerHTML="<h2>"+r.name+"<small>"+running+" on</small></h2>";
    r.devs.forEach(function(d){
      var row=document.createElement("div");
      row.className="dev"+(state[d.id]&&!d.sensor?" is-on":"");
      if(d.sensor){
        row.innerHTML='<div><div class="n">'+d.n+'</div><div class="s">Checked just now</div></div><span class="sensor'+(state[d.id]?"":" bad")+'">'+(state[d.id]?"No leak":"Leak detected")+"</span>";
      }else{
        row.innerHTML='<div><div class="n">'+d.n+'</div><div class="s">'+(state[d.id]?d.t[0]:d.t[1])+'</div></div><button class="tg" role="switch" aria-label="'+d.n+'" aria-checked="'+state[d.id]+'" data-id="'+d.id+'"></button>';
      }
      el.appendChild(row);
    });
    var b=document.createElement("button");b.className="btn";
    b.textContent=r.name==="Security"?"Arm all security":"Turn off "+r.name.toLowerCase();
    b.onclick=function(){
      r.devs.forEach(function(d){if(!d.sensor)state[d.id]=(r.name==="Security");});
      log(r.name==="Security"?"Security fully armed":r.name+" turned off");render();
    };
    el.appendChild(b);host.appendChild(el);
  });
  host.querySelectorAll(".tg").forEach(function(t){
    t.onclick=function(){
      var d=find(t.dataset.id);state[d.id]=!state[d.id];
      log(d.n+" – "+(state[d.id]?d.t[0]:d.t[1]).toLowerCase());render();
    };
  });
  var n=0;rooms.forEach(function(r){r.devs.forEach(function(d){if(!d.sensor&&state[d.id]&&r.name!=="Security")n++;});});
  document.getElementById("count").textContent=n;
  document.getElementById("sec").textContent=(state["s-door"]&&state["s-alarm"])?"Secure":"Check security";
  document.getElementById("temp").textContent=state["lr-ac"]?"24°C":"27°C";
}
document.getElementById("allOff").onclick=function(){
  rooms.forEach(function(r){if(r.name!=="Security")r.devs.forEach(function(d){if(!d.sensor)state[d.id]=false;});});
  log("All lights and appliances turned off");render();
};
document.getElementById("lockUp").onclick=function(){
  state["s-door"]=true;state["s-alarm"]=true;state["s-cam"]=true;
  log("Door locked, alarm armed, camera recording");render();
};
render();
</script>
</body>
</html>
